<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f172a" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>ImageForge</title>
    <meta
      name="description"
      content="Analyze, patch and verify Android images locally in your browser."
    />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("imageforge.theme");
          var mode = stored === "light" || stored === "dark" || stored === "system" ? stored : "system";
          var dark =
            mode === "dark" ||
            (mode === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.dataset.themeMode = mode;
          // The catalogue loads on demand, so the language of the document is set here to keep
          // lang correct from the first paint.
          var locale = localStorage.getItem("imageforge.locale");
          if (locale === "en" || locale === "zh-Hans" || locale === "zh-Hant" || locale === "ja") {
            document.documentElement.lang = locale;
          }
        } catch (error) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
