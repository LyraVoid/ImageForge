  <rect x="14" y="27" width="10" height="10" rx="2.2" fill="#394659"/>
  <rect x="27" y="27" width="10" height="10" rx="2.2" fill="#f5ba26"/>
  <rect x="40" y="27" width="10" height="10" rx="2.2" fill="#394659"/>
  <rect x="14" y="40" width="10" height="10" rx="2.2" fill="#f5ba26"/>
