[package]
name = "imageforge-wasm"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Binary helpers for ImageForge: CRC32, LZ4 block coding and xz/LZMA2."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
name = "imageforge_wasm"

[profile.release]
opt-level = "z"
lto = true
panic = "abort"
strip = true
[dependencies]
# The same crate and version Magisk's magiskboot uses, so the xz streams agree in settings.
lzma-rust2 = { version = "0.21.0", default-features = false, features = ["std", "xz", "encoder"] }
# Decode only, pure Rust: real OTA payloads carry REPLACE_BZ blobs, and a C binding would not build
# for wasm32-unknown-unknown without dragging a C toolchain into the browser build.
bzip2-rs = "0.1.2"
